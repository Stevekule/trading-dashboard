<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif;background:#1a1d23;color:#d0d4dc;line-height:1.55;padding:16px}
.board{max-width:1100px;margin:0 auto}
.panel{background:#22252e;border:1px solid #333842;border-radius:10px;padding:16px 18px;margin-bottom:14px}
h1{font-size:19px;color:#f0f2f5;margin-bottom:3px}
h2{font-size:15px;color:#9aa0b0;border-bottom:1px solid #333842;padding-bottom:7px;margin-bottom:12px;letter-spacing:.5px}
h3{font-size:14px;color:#b8bfce;margin:14px 0 8px}
.header-panel{background:linear-gradient(135deg,#1e2440,#2a3050);border-color:#3a4068;padding:20px 22px}
.header-panel .date{font-size:12px;color:#6b7290;margin-bottom:6px}
.header-panel .mkt-stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:13px}
.header-panel .mkt-stats span{background:rgba(255,255,255,.06);padding:4px 10px;border-radius:6px}
.watch-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:900px){.watch-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.watch-grid{grid-template-columns:1fr}}
.watch-card{background:#2a2e38;border-radius:8px;padding:10px 12px;border-left:3px solid #444;position:relative}
.watch-card.priority-1{border-left-color:#ec4e4e}
.watch-card.priority-2{border-left-color:#e8a830}
.watch-card.priority-3{border-left-color:#5aa8f0}
.watch-card.priority-4{border-left-color:#6b7180}
.watch-card .wc-code{font-size:10px;color:#6b7180;margin-bottom:2px}
.watch-card .wc-name{font-size:13px;font-weight:700;color:#e0e4ec}
.watch-card .wc-price{font-size:17px;font-weight:700;margin:3px 0}
.watch-card .wc-change{font-size:12px}
.watch-card .wc-signal{font-size:11px;color:#9aa0b0;margin-top:4px;line-height:1.3}
.watch-card .wc-badge{position:absolute;top:8px;right:10px;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:700}
.badge-hold{background:#2a3a20;color:#3ec97e}
.badge-buy{background:#3a2020;color:#ec4e4e}
.badge-watch{background:#2a2a30;color:#9aa0b0}
.badge-dont{background:#3a1a1a;color:#ec6b6b}
.up{color:#ec4e4e}.down{color:#3ec97e}.neutral{color:#e8a830}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#2a2e38;text-align:left;padding:7px 9px;font-weight:600;color:#9aa0b0;border-bottom:2px solid #333842}
td{padding:7px 9px;border-bottom:1px solid #2a2e38;vertical-align:top}
tr:hover td{background:#272b35}
.code{font-size:11px;color:#6b7180}
.price{display:inline-block;font-family:"Consolas","Courier New",monospace;padding:1px 7px;border-radius:4px;font-weight:700;font-size:12px;margin:0 2px}
.price-trigger{background:#3a1f1f;color:#ec4e4e;border:1px solid #5a2a2a}
.price-support{background:#1f2e1f;color:#3ec97e;border:1px solid #2a4a2a}
.price-neutral{background:#2a2e38;color:#e8a830;border:1px solid #3a3520}
.price-target{background:#1f2a3a;color:#5aa8f0;border:1px solid #2a3a5a}
.alert-r{background:#2a1a1a;border-left:3px solid #ec4e4e;padding:9px 13px;border-radius:6px;margin:8px 0;font-size:12px;color:#e8c0c0}
.alert-g{background:#1a2a1a;border-left:3px solid #3ec97e;padding:9px 13px;border-radius:6px;margin:8px 0;font-size:12px;color:#c0e8c0}
.alert-y{background:#2a2818;border-left:3px solid #e8a830;padding:9px 13px;border-radius:6px;margin:8px 0;font-size:12px;color:#e8d8a0}
.alert-b{background:#1a2030;border-left:3px solid #5aa8f0;padding:9px 13px;border-radius:6px;margin:8px 0;font-size:12px;color:#b0c8e8}
.flow{display:flex;gap:10px;flex-wrap:wrap}
.flow-item{flex:1;min-width:130px;background:#2a2e38;border-radius:8px;padding:10px;text-align:center;font-size:12px}
.flow-item .fi-time{font-size:14px;font-weight:700;color:#e8a830;margin-bottom:3px}
.flow-item .fi-action{font-weight:600;margin:3px 0;font-size:13px}
.flow-item .fi-note{font-size:10px;color:#6b7180}
.kpi-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.kpi{background:#2a2e38;border-radius:8px;padding:9px 12px;text-align:center;flex:1;min-width:80px}
.kpi .v{font-size:17px;font-weight:700}
.kpi .lbl{font-size:10px;color:#6b7180;margin-top:2px}
.signal-tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:3px;font-weight:700;margin-right:3px}
.sig-green{background:#1a3a1a;color:#3ec97e}
.sig-yellow{background:#3a3018;color:#e8a830}
.sig-red{background:#3a1a1a;color:#ec6b6b}
.sig-blue{background:#1a2a3a;color:#5aa8f0}
.highlight{background:rgba(232,168,48,.15);border-radius:3px;padding:1px 5px;font-weight:600;color:#e8c870}
.footer{text-align:center;color:#4a5060;font-size:10px;margin-top:18px;padding-top:10px;border-top:1px solid #2a2e38}
.gold-tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:3px;font-weight:700;background:#3a2f1a;color:#e8c870}
.rps-tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:3px;font-weight:700;background:#1a2a3a;color:#5aa8f0}
.watch-card .wc-tag{display:inline-block;font-size:9px;padding:1px 5px;border-radius:3px;margin-right:3px;margin-top:3px}
.tag-c6{background:#3a2a10;color:#e8a830}
.tag-dbl{background:#102a3a;color:#5aa8f0}
.mkt-panel{background:#22252e;border:1px solid #333842;border-radius:10px;padding:14px 16px;margin-bottom:14px}
.mkt-panel h3{font-size:14px;color:#b8bfce;margin-bottom:10px}
.mkt-kpi{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mkt-kpi .kpi{background:#2a2e38;border-radius:8px;padding:7px 11px;min-width:84px;text-align:center}
.mkt-kpi .kpi .v{font-size:16px;font-weight:700}
.mkt-kpi .kpi .l{font-size:10px;color:#6b7180;margin-top:2px}
.mkt-chart{width:100%;overflow-x:auto;margin-bottom:8px}
.mkt-note{font-size:12px;color:#9aa0b0;margin:6px 0}
.mkt-analysis{background:#262a35;border-left:3px solid #5aa8f0;border-radius:6px;padding:9px 13px;margin-top:10px;font-size:12px;color:#c8d0dc;line-height:1.7}
.mkt-analysis b{color:#f0f2f5}
.sig-up{color:#ec4e4e}.sig-dn{color:#3ec97e}.sig-nt{color:#e8a830}
.rank-bar{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px}
.rank-bar .name{width:70px;text-align:right;color:#c8d0dc}
.rank-bar .bar{flex:1;height:14px;background:#2a2e38;border-radius:3px;overflow:hidden}
.rank-bar .fill{height:100%;border-radius:3px}
.rank-bar .val{width:52px;color:#9aa0b0;font-size:11px}
</style>
</head>
<body>
<script>
(function(){ if (window.__mktTip) return; window.__mktTip = 1;
var d = document.createElement('div'); d.id = 'mkt-tip';
d.style.cssText = 'position:fixed;z-index:99999;pointer-events:none;display:none;background:rgba(18,20,26,.96);color:#e8ecf4;font-size:11px;line-height:1.55;padding:6px 10px;border-radius:6px;border:1px solid #3a4060;box-shadow:0 3px 12px rgba(0,0,0,.45);white-space:nowrap;font-family:Consolas,"Microsoft YaHei",monospace';
document.body.appendChild(d);
document.addEventListener('mouseover', function(e){
  var t = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
  if (!t) { d.style.display = 'none'; return; }
  d.textContent = t.getAttribute('data-tip'); d.style.display = 'block';
});
document.addEventListener('mousemove', function(e){
  if (d.style.display === 'block') {
    var x = e.clientX + 14, y = e.clientY + 14;
    if (x + 260 > window.innerWidth) x = e.clientX - 270;
    if (y + 70 > window.innerHeight) y = e.clientY - 50;
    d.style.left = x + 'px'; d.style.top = y + 'px';
  }
});
})();
</script>
<div class="board">
{{BODY}}
</div>
<div class="footer">
{{FOOTER}}
</div>
</body>
</html>
